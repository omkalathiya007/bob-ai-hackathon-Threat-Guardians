submission:
  title: "Threat Intelligence Correlation and Alert Prioritisation Assistant"

  problem_statement: >
    Cybersecurity teams receive a large amount of threat information
    from different sources. It is difficult to monitor, understand,
    and analyse these threats quickly and prioritise important alerts.

  solution_summary: >
    Threat Guardians is a cybersecurity dashboard that helps users
    explore threat intelligence, correlate security alerts, and
    understand important threats through a user-friendly interface.

  key_features:
    - "Multi-Source Threat Feeds"
    - "Alert Correlation"
    - "MITRE ATT&CK Mapping"
    - "Threat Prioritization"
    - "BLUF Summaries"

  tech_stack:
    languages:
      - "Python"
      - "HTML"
      - "CSS"
      - "JavaScript"

    frameworks:
      - "Streamlit"

    llm_technologies:
      - "IBM watsonx"

    databases:
      - "PostgreSQL"

    other:
      - "REST APIs"
      - "GitHub"

  what_are_you_most_proud_of: >
    We are proud of developing a cybersecurity dashboard that
    organizes threat intelligence and helps users understand
    security alerts more efficiently.

  known_limitations: >
    The system depends on the availability and quality of threat
    intelligence data. Some advanced features may require further
    testing and integration.


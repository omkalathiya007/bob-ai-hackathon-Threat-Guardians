submission:
  title: "Threat Intelligence Correlation and Alert Prioritisation Assistant"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Cybersecurity teams receive a large amount of threat information from different sources.It can be difficult to monitor, understand, and analyze these threats quickly.Threat Guardians aims to provide a simple dashboard that helps users view and understand cybersecurity threat information in an organized way.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
   Threat Guardians is a cybersecurity dashboard that displays threat-related information through a user-friendly web interface.

The project helps users explore threat data, view security alerts, and understand important information using an organized dashboard.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
   Multi-Source Threat Feeds - "Collects threat data from multiple security sources."                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
   Alert Correlation - "Combines related alerts and reduces duplicate or false-positive alerts."
   MITRE ATT&CK Mapping - "Maps detected attacker activities to MITRE ATT&CK techniques"
   Threat Prioritization - "Assigns risk levels to help analysts focus on serious threats."                               # optional 4th
   BLUF Summaries - "Generates clear, prioritized investigation summaries for commanders"                               # optional 5th

  tech_stack:
    languages: [HTML, CSS, JavaScript]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: [None]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: [IBM Bob]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: [None GitHub]                      # e.g., ["PostgreSQL", "Redis"]
    other: [ GitHub Actions]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

